name: Back4App Auto Redeploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/back4app_redeploy.py
        env:
          BACK4APP_COOKIE: ${{ secrets.BACK4APP_COOKIE }}
